[project]
name = "formation-api"
version = "0.1.0"
description = "Business Formation API - Entity formation, registered agent, EIN, and compliance services"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
